<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>MondrianMarket · Stable Grid</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            width: 100%; 
            height: 100dvh; 
            overflow: hidden;
            overscroll-behavior: none; 
            position: fixed;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000;
            color: #F0F0F0;
        }

        /* --- GRIGLIA FLUIDA (No spazi vuoti) --- */
        #grid-container {
            display: grid;
            grid-template-columns: var(--c1, 33.33%) var(--c2, 33.33%) var(--c3, 33.34%);
            grid-template-rows: var(--r1, 50%) var(--r2, 50%);
            width: 100%;
            height: 100%;
            gap: 3px; /* Spessore linee nere */
            background-color: #000; 
            position: relative;
        }

        .box {
            position: relative;
            background-color: #0B1B2B;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.5s ease, transform 0.2s ease, opacity 0.2s ease;
            overflow: hidden;
            z-index: 1;
            /* Previene lo scroll nativo su iOS mentre si trascina */
            touch-action: none; 
        }

        .box.up { background-color: #0B1B2B; }
        .box.down { background-color: #2B0B0B; }
        
        /* Modalità Focus a schermo intero */
        .box.focus-mode {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100;
            border: none;
        }

        /* Animazione Drag & Drop (Swap) */
        .box.dragging {
            opacity: 0.3;
            transform: scale(0.95);
            z-index: 50;
        }
        .box.drag-over {
            border: 3px solid #F7D117;
            z-index: 10;
        }

        /* --- CONTENUTI INTERNI (Safe Area iOS) --- */
        .box-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            pointer-events: none; /* I click passano al box genitore */
        }

        /* Applica la safe area solo al contenuto, non al colore di sfondo */
        #grid-container > .box:nth-child(1) .box-content,
        #grid-container > .box:nth-child(2) .box-content,
        #grid-container > .box:nth-child(3) .box-content {
            padding-top: env(safe-area-inset-top);
        }

        #grid-container > .box:nth-child(4) .box-content,
        #grid-container > .box:nth-child(5) .box-content,
        #grid-container > .box:nth-child(6) .box-content {
            padding-bottom: env(safe-area-inset-bottom);
        }

        .box.focus-mode .box-content {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .tf-label {
            position: absolute; 
            top: 15px; left: 15px;
            font-size: 0.8rem; font-weight: 600;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.1em;
        }
        
        .box.focus-mode .tf-label { top: calc(15px + env(safe-area-inset-top)); left: 25px; font-size: 1.2rem; }

        .tf-count {
            font-size: 3rem; font-weight: 200; line-height: 1;
            text-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .box.focus-mode .tf-count { font-size: 10rem; }

        .tf-dots { display: flex; gap: 6px; margin-top: 10px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background-color: #E0E0E0; }

        /* --- RESIZER DIVIDERS --- */
        .resizer {
            position: absolute;
            background: transparent;
            z-index: 20;
            touch-action: none;
        }
        /* Verticali */
        .resizer-v {
            width: 30px;
            height: 100%;
            cursor: col-resize;
            top: 0;
        }
        .resizer-v[data-index="0"] { left: calc(var(--c1, 33.33%) - 15px); }
        .resizer-v[data-index="1"] { left: calc(var(--c1, 33.33%) + var(--c2, 33.33%) - 15px); }

        /* Orizzontale */
        .resizer-h {
            height: 30px;
            width: 100%;
            cursor: row-resize;
            left: 0;
            top: calc(var(--r1, 50%) - 15px);
        }

    </style>
</head>
<body>

    <div id="grid-container">
        <!-- I box vengono generati via JS -->
        <!-- I resizer per il ridimensionamento fluido -->
        <div class="resizer resizer-v" data-index="0"></div>
        <div class="resizer resizer-v" data-index="1"></div>
        <div class="resizer resizer-h"></div>
    </div>

    <script>
        const COINS = ['BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'XRPUSDT', 'BNBUSDT'];
        let activeCoinIndex = 0;
        let SYMBOL = COINS[activeCoinIndex];
        const BASE_URL = 'https://api.bitget.com';
        const gridContainer = document.getElementById('grid-container');

        // Array di dati. L'ordine determina la posizione nella griglia.
        let tfDataArray = ['1D', '4H', '1H', '12H', '15m', '30m'];
        
        const GRANULARITY = {
            '15m': '15min', '30m': '30min', '1H': '1h',
            '4H': '4h', '12H': '12h', '1D': '1day'
        };

        const state = { activeTF: '4H', timeframes: {} };
        tfDataArray.forEach(tf => { state.timeframes[tf] = { trend: 'up', count: 0, price: '...' }; });

        // --- RENDER ---
        function initGrid() {
            // Rimuovi i vecchi box (mantieni i resizer)
            document.querySelectorAll('.box').forEach(b => b.remove());

            // Genera i box basandosi sull'array
            tfDataArray.forEach((tfKey, index) => {
                const box = document.createElement('div');
                box.className = `box up`;
                box.dataset.tf = tfKey;
                box.dataset.index = index;
                box.id = `box-${tfKey}`;
                
                box.innerHTML = `
                    <div class="box-content">
                        <div class="tf-label">${tfKey}</div>
                        <div class="tf-count" id="count-${tfKey}">-</div>
                        <div class="tf-dots" id="dots-${tfKey}" style="display:none;"></div>
                    </div>
                `;
                
                // Inserisci prima dei resizer
                gridContainer.insertBefore(box, gridContainer.firstChild);
            });

            renderValues();
        }

        function renderValues() {
            tfDataArray.forEach(tfKey => {
                const data = state.timeframes[tfKey];
                const countEl = document.getElementById(`count-${tfKey}`);
                const dotsEl = document.getElementById(`dots-${tfKey}`);
                const box = document.getElementById(`box-${tfKey}`);

                if (!box || !countEl) return;

                box.classList.toggle('up', data.trend === 'up');
                box.classList.toggle('down', data.trend === 'down');

                if (data.count <= 5) {
                    countEl.style.display = 'block';
                    countEl.textContent = data.count > 0 ? data.count : '-';
                    dotsEl.style.display = 'none';
                } else {
                    countEl.style.display = 'none';
                    dotsEl.style.display = 'flex';
                    dotsEl.innerHTML = '<div class="dot"></div>'.repeat(5);
                }
            });
        }

        // --- API BITGET ---
        async function fetchCandles(granularity) {
            const url = `${BASE_URL}/api/v2/spot/market/candles?symbol=${SYMBOL}&granularity=${granularity}&limit=10`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const json = await res.json();
            if (json.code !== '00000') throw new Error(json.msg || 'API error');
            return json.data;
        }

        function calculateStreak(candles) {
            if (!candles || candles.length === 0) return { trend: 'up', count: 0 };
            let streak = 0, lastDirection = null;
            for (let i = candles.length - 1; i >= 0; i--) {
                const [, open, , , close] = candles[i];
                const openF = parseFloat(open), closeF = parseFloat(close);
                let dir = closeF > openF ? 'up' : (closeF < openF ? 'down' : 'neutral');
                if (dir === 'neutral') continue;
                if (lastDirection === null) { lastDirection = dir; streak = 1; }
                else if (dir === lastDirection) { streak++; }
                else { break; }
            }
            return { trend: lastDirection || 'up', count: streak };
        }

        async function updateTimeframe(tfKey) {
            try {
                const candles = await fetchCandles(GRANULARITY[tfKey]);
                const { trend, count } = calculateStreak(candles);
                let price = parseFloat(candles[candles.length - 1][4]);
                let priceStr = price > 1000 ? price.toFixed(2) : price.toFixed(4);
                state.timeframes[tfKey] = { trend, count, price: priceStr.replace(/\B(?=(\d{3})+(?!\d))/g, ",") };
            } catch (err) { console.error(`Errore ${tfKey}:`, err); }
        }

        async function updateAll() {
            await Promise.all(tfDataArray.map(tf => updateTimeframe(tf)));
            renderValues();
        }

        // --- LOGICA RESIZER (Split Panes) ---
        let resizingType = null;
        let startX, startY;
        let startCol1, startCol2, startRow1;

        document.querySelectorAll('.resizer-v').forEach(resizer => {
            resizer.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                resizingType = 'v';
                resizer.dataset.active = resizer.dataset.index;
                startX = e.clientX;
                
                const style = getComputedStyle(gridContainer);
                startCol1 = parseFloat(style.getPropertyValue('--c1')) || (window.innerWidth / 3);
                startCol2 = parseFloat(style.getPropertyValue('--c2')) || (window.innerWidth / 3);
                
                resizer.setPointerCapture(e.pointerId);
            });
        });

        document.querySelector('.resizer-h').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            resizingType = 'h';
            startY = e.clientY;
            
            const style = getComputedStyle(gridContainer);
            startRow1 = parseFloat(style.getPropertyValue('--r1')) || (window.innerHeight / 2);
            
            e.target.setPointerCapture(e.pointerId);
        });

        document.addEventListener('pointermove', (e) => {
            if (!resizingType) return;
            
            if (resizingType === 'v') {
                const activeIndex = document.querySelector('.resizer-v[data-active]')?.dataset.active;
                if (activeIndex === undefined) return;

                const deltaX = e.clientX - startX;
                const totalWidth = window.innerWidth;
                
                if (activeIndex === "0") {
                    let newC1 = startCol1 + deltaX;
                    // Limiti min/max
                    if (newC1 < 80) newC1 = 80;
                    if (newC1 > totalWidth - 160) newC1 = totalWidth - 160;
                    gridContainer.style.setProperty('--c1', `${(newC1 / totalWidth) * 100}%`);
                } else {
                    let newC2 = startCol2 + deltaX;
                    const c1Px = (parseFloat(getComputedStyle(gridContainer).getPropertyValue('--c1')) / 100) * totalWidth;
                    if (newC2 < 80) newC2 = 80;
                    if (c1Px + newC2 > totalWidth - 80) newC2 = totalWidth - c1Px - 80;
                    gridContainer.style.setProperty('--c2', `${(newC2 / totalWidth) * 100}%`);
                }
            } else if (resizingType === 'h') {
                const deltaY = e.clientY - startY;
                const totalHeight = window.innerHeight;
                let newR1 = startRow1 + deltaY;
                
                if (newR1 < 100) newR1 = 100;
                if (newR1 > totalHeight - 100) newR1 = totalHeight - 100;
                gridContainer.style.setProperty('--r1', `${(newR1 / totalHeight) * 100}%`);
            }
        });

        document.addEventListener('pointerup', () => {
            resizingType = null;
            document.querySelectorAll('.resizer-v').forEach(r => delete r.dataset.active);
        });

        // --- LOGICA DRAG & DROP (Swap) ---
        let draggedBox = null;
        let pressTimer;
        let startPos = { x: 0, y: 0 };
        let isDragging = false;

        document.addEventListener('pointerdown', (e) => {
            const box = e.target.closest('.box');
            if (!box) return;

            // Se il box è in focus mode, gestiamo il click per uscire
            if (box.classList.contains('focus-mode')) {
                startPos = { x: e.clientX, y: e.clientY };
                return;
            }

            startPos = { x: e.clientX, y: e.clientY };
            isDragging = false;
            
            pressTimer = setTimeout(() => {
                isDragging = true;
                draggedBox = box;
                box.classList.add('dragging');
                if (navigator.vibrate) navigator.vibrate(20);
            }, 300);
        });

        document.addEventListener('pointermove', (e) => {
            // Se l'utente muove il dito prima del timer, annulla il drag
            if (!isDragging && pressTimer) {
                const dist = Math.abs(e.clientX - startPos.x) + Math.abs(e.clientY - startPos.y);
                if (dist > 10) clearTimeout(pressTimer);
                return;
            }

            if (isDragging && draggedBox) {
                e.preventDefault();
                const element = document.elementFromPoint(e.clientX, e.clientY);
                const targetBox = element ? element.closest('.box') : null;
                
                document.querySelectorAll('.box').forEach(b => b.classList.remove('drag-over'));
                if (targetBox && targetBox !== draggedBox) {
                    targetBox.classList.add('drag-over');
                }
            }
        });

        document.addEventListener('pointerup', (e) => {
            clearTimeout(pressTimer);

            if (isDragging && draggedBox) {
                const element = document.elementFromPoint(e.clientX, e.clientY);
                const targetBox = element ? element.closest('.box') : null;

                if (targetBox && targetBox !== draggedBox) {
                    // Logica di SWAP basata sull'array di dati (Super Sicura)
                    const indexA = parseInt(draggedBox.dataset.index);
                    const indexB = parseInt(targetBox.dataset.index);
                    
                    const temp = tfDataArray[indexA];
                    tfDataArray[indexA] = tfDataArray[indexB];
                    tfDataArray[indexB] = temp;

                    initGrid(); // Ridisegna la griglia nell'ordine corretto
                }
                
                draggedBox.classList.remove('dragging');
                document.querySelectorAll('.box').forEach(b => b.classList.remove('drag-over'));
                draggedBox = null;
                isDragging = false;
                
            } else if (!isDragging) {
                // TAP LOGIC
                const box = e.target.closest('.box');
                if (box) {
                    const dist = Math.abs(e.clientX - startPos.x) + Math.abs(e.clientY - startPos.y);
                    if (dist < 10) {
                        box.classList.toggle('focus-mode');
                        if (navigator.vibrate) navigator.vibrate(10);
                    }
                }
            }
        });

        // --- INIZIO ---
        initGrid();
        updateAll();
        setInterval(updateAll, 15000);
    </script>
</body>
</html>
