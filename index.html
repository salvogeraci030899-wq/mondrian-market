<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>MondrianMarket · Flex Grid</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            width: 100%; 
            height: 100dvh; 
            overflow: hidden;
            overscroll-behavior: none; 
            position: fixed;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000;
            color: #F0F0F0;
        }

        /* --- LAYOUT FLESSIBILE --- */
        #grid-container {
            display: flex;
            flex-wrap: wrap;
            width: 100%;
            height: 100%;
            background-color: #000; /* Colore delle linee di separazione */
            gap: 3px; 
            padding: 3px; /* Bordino esterno nero */
            padding-top: max(3px, env(safe-area-inset-top));
            padding-bottom: max(3px, env(safe-area-inset-bottom));
        }

        .box {
            position: relative;
            background-color: #0B1B2B;
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1 1 calc(25% - 3px); /* Default: 4 colonne */
            min-width: 80px;
            min-height: 80px;
            transition: background-color 0.5s ease, opacity 0.2s ease, transform 0.2s ease;
            overflow: hidden;
            touch-action: none;
        }

        .box.up { background-color: #0B1B2B; }
        .box.down { background-color: #2B0B0B; }
        
        /* Animazione Focus */
        .box.focus-mode {
            position: fixed;
            top: 0; left: 0; width: 100% !important; height: 100% !important;
            z-index: 100;
            border: none;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .box.dragging { opacity: 0.3; transform: scale(0.95); z-index: 50; }
        .box.drag-over { border: 3px solid #F7D117; z-index: 10; }

        /* --- CONTENUTI INTERNI --- */
        .box-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%; height: 100%;
            pointer-events: none;
        }

        .tf-count {
            font-size: 2.5rem; font-weight: 200; line-height: 1;
            text-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .box.focus-mode .tf-count { font-size: 10rem; }

        .tf-dots { display: flex; gap: 6px; margin-top: 8px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background-color: #E0E0E0; }
        .box.focus-mode .tf-dots { gap: 12px; margin-top: 20px; }
        .box.focus-mode .dot { width: 16px; height: 16px; }

        /* --- LINGUETTA DRAG (In alto a sinistra) --- */
        .drag-handle {
            position: absolute;
            top: 0; left: 0;
            width: 40px; height: 40px;
            display: flex; justify-content: flex-start; align-items: flex-start;
            padding: 8px;
            color: rgba(255,255,255,0.3);
            font-size: 1.2rem; font-weight: 600;
            z-index: 30; cursor: grab;
        }
        .drag-handle::before { content: "⋮⋮"; letter-spacing: -2px; }
        
        .tf-label {
            position: absolute; top: 12px; left: 35px;
            font-size: 0.75rem; font-weight: 600;
            color: rgba(255,255,255,0.4);
            pointer-events: none;
        }
        .box.focus-mode .tf-label { top: calc(15px + env(safe-area-inset-top)); left: 45px; font-size: 1.2rem; }

        /* --- MANIGLIA RESIZE (In basso a destra) --- */
        .resize-handle {
            position: absolute;
            bottom: 0; right: 0;
            width: 40px; height: 40px;
            display: flex; justify-content: flex-end; align-items: flex-end;
            padding: 8px;
            z-index: 30; cursor: se-resize;
        }
        .resize-handle::before {
            content: ""; width: 10px; height: 10px;
            border-right: 2px solid rgba(255,255,255,0.3);
            border-bottom: 2px solid rgba(255,255,255,0.3);
        }
        .box.focus-mode .resize-handle { display: none; }

        /* --- PILLOLA PREZZO (Tap nel focus) --- */
        #price-pill {
            position: absolute; left: 50%; bottom: calc(5% + env(safe-area-inset-bottom));
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px; padding: 12px 24px;
            font-size: 1.2rem; font-weight: 300; gap: 15px;
            display: flex; align-items: center;
            opacity: 0; transform: translate(-50%, 20px); 
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 200; pointer-events: none;
        }
        #price-pill.show { opacity: 1; transform: translate(-50%, 0); }
        #price-pill .tf-label { position: static; font-size: 0.8rem; color: #aaa; }

    </style>
</head>
<body>

    <div id="grid-container"></div>

    <div id="price-pill">
        <span id="pill-price">-</span>
        <span class="tf-label" id="pill-tf">4H</span>
    </div>

    <script>
        const COINS = ['BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'XRPUSDT', 'BNBUSDT'];
        let activeCoinIndex = 0;
        let SYMBOL = COINS[activeCoinIndex];
        const BASE_URL = 'https://api.bitget.com';
        const gridContainer = document.getElementById('grid-container');

        // Aggiunti 8 Timeframe
        let tfDataArray = ['1W', '1D', '12H', '4H', '1H', '30m', '15m', '5m'];
        
        const GRANULARITY = {
            '5m': '5min', '15m': '15min', '30m': '30min', '1H': '1h',
            '4H': '4h', '12H': '12h', '1D': '1day', '1W': '1week'
        };

        const state = { timeframes: {} };
        tfDataArray.forEach(tf => { state.timeframes[tf] = { trend: 'up', count: 0, price: '...' }; });

        // --- RENDER GRIGLIA ---
        function initGrid() {
            gridContainer.innerHTML = '';

            tfDataArray.forEach((tfKey, index) => {
                const box = document.createElement('div');
                box.className = `box up`;
                box.dataset.tf = tfKey;
                box.dataset.index = index;
                box.id = `box-${tfKey}`;
                
                box.innerHTML = `
                    <div class="drag-handle"></div>
                    <div class="tf-label">${tfKey}</div>
                    <div class="box-content">
                        <div class="tf-count" id="count-${tfKey}">-</div>
                        <div class="tf-dots" id="dots-${tfKey}" style="display:none;"></div>
                    </div>
                    <div class="resize-handle"></div>
                `;
                
                gridContainer.appendChild(box);
            });

            renderValues();
        }

        function renderValues() {
            tfDataArray.forEach(tfKey => {
                const data = state.timeframes[tfKey];
                const countEl = document.getElementById(`count-${tfKey}`);
                const dotsEl = document.getElementById(`dots-${tfKey}`);
                const box = document.getElementById(`box-${tfKey}`);

                if (!box || !countEl) return;

                box.classList.toggle('up', data.trend === 'up');
                box.classList.toggle('down', data.trend === 'down');

                if (data.count <= 5) {
                    countEl.style.display = 'block';
                    countEl.textContent = data.count > 0 ? data.count : '-';
                    dotsEl.style.display = 'none';
                } else {
                    countEl.style.display = 'none';
                    dotsEl.style.display = 'flex';
                    dotsEl.innerHTML = '<div class="dot"></div>'.repeat(5);
                }
            });
        }

        // --- API ---
        async function fetchCandles(granularity) {
            const url = `${BASE_URL}/api/v2/spot/market/candles?symbol=${SYMBOL}&granularity=${granularity}&limit=10`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const json = await res.json();
            if (json.code !== '00000') throw new Error(json.msg || 'API error');
            return json.data;
        }

        function calculateStreak(candles) {
            if (!candles || candles.length === 0) return { trend: 'up', count: 0 };
            let streak = 0, lastDirection = null;
            for (let i = candles.length - 1; i >= 0; i--) {
                const [, open, , , close] = candles[i];
                const openF = parseFloat(open), closeF = parseFloat(close);
                let dir = closeF > openF ? 'up' : (closeF < openF ? 'down' : 'neutral');
                if (dir === 'neutral') continue;
                if (lastDirection === null) { lastDirection = dir; streak = 1; }
                else if (dir === lastDirection) { streak++; }
                else { break; }
            }
            return { trend: lastDirection || 'up', count: streak };
        }

        async function updateTimeframe(tfKey) {
            try {
                const candles = await fetchCandles(GRANULARITY[tfKey]);
                const { trend, count } = calculateStreak(candles);
                let price = parseFloat(candles[candles.length - 1][4]);
                let priceStr = price > 1000 ? price.toFixed(2) : price.toFixed(4);
                state.timeframes[tfKey] = { trend, count, price: priceStr.replace(/\B(?=(\d{3})+(?!\d))/g, ",") };
            } catch (err) { console.error(`Errore ${tfKey}:`, err); }
        }

        async function updateAll() {
            await Promise.all(tfDataArray.map(tf => updateTimeframe(tf)));
            renderValues();
        }

        // --- INTERAZIONI ---
        let interactionMode = null; // 'drag' o 'resize'
        let activeElement = null;
        let startX, startY, startW, startH;

        gridContainer.addEventListener('pointerdown', (e) => {
            const box = e.target.closest('.box');
            if (!box || box.classList.contains('focus-mode')) return;

            const isDragHandle = e.target.classList.contains('drag-handle');
            const isResizeHandle = e.target.classList.contains('resize-handle');

            if (isDragHandle) {
                interactionMode = 'drag';
                activeElement = box;
                startX = e.clientX; startY = e.clientY;
                
                // Timer per dare un feedback visivo
                setTimeout(() => {
                    if (interactionMode === 'drag' && activeElement) {
                        activeElement.classList.add('dragging');
                        if (navigator.vibrate) navigator.vibrate(20);
                    }
                }, 100);
            } 
            else if (isResizeHandle) {
                interactionMode = 'resize';
                activeElement = box;
                startX = e.clientX; startY = e.clientY;
                startW = activeElement.offsetWidth;
                startH = activeElement.offsetHeight;
            }
        });

        document.addEventListener('pointermove', (e) => {
            if (!interactionMode || !activeElement) return;
            e.preventDefault();

            if (interactionMode === 'drag') {
                const element = document.elementFromPoint(e.clientX, e.clientY);
                const targetBox = element ? element.closest('.box') : null;
                
                document.querySelectorAll('.box').forEach(b => b.classList.remove('drag-over'));
                if (targetBox && targetBox !== activeElement) {
                    targetBox.classList.add('drag-over');
                }
            } 
            else if (interactionMode === 'resize') {
                const deltaX = e.clientX - startX;
                const deltaY = e.clientY - startY;
                
                // Calcola la nuova larghezza/altezza in percentuale rispetto al contenitore
                const containerRect = gridContainer.getBoundingClientRect();
                
                let newW = startW + deltaX;
                let newH = startH + deltaY;

                // Converti in percentuale
                let percW = (newW / containerRect.width) * 100;
                let percH = (newH / containerRect.height) * 100;

                // Limiti Minimi e Massimi
                percW = Math.max(15, Math.min(100, percW));
                percH = Math.max(15, Math.min(100, percH));

                // Applica la dimensione come flex-basis (per farlo adattare agli altri)
                // Usiamo calc per tenere conto del gap
                activeElement.style.flex = `0 0 calc(${percW}% - 3px)`;
                activeElement.style.height = `calc(${percH}% - 3px)`;
            }
        });

        document.addEventListener('pointerup', (e) => {
            if (!interactionMode || !activeElement) return;

            if (interactionMode === 'drag') {
                const element = document.elementFromPoint(e.clientX, e.clientY);
                const targetBox = element ? element.closest('.box') : null;

                if (targetBox && targetBox !== activeElement) {
                    // Scambia i dati nell'array e ridisegna
                    const indexA = parseInt(activeElement.dataset.index);
                    const indexB = parseInt(targetBox.dataset.index);
                    
                    const temp = tfDataArray[indexA];
                    tfDataArray[indexA] = tfDataArray[indexB];
                    tfDataArray[indexB] = temp;

                    initGrid();
                }
                
                activeElement.classList.remove('dragging');
                document.querySelectorAll('.box').forEach(b => b.classList.remove('drag-over'));
            }

            interactionMode = null;
            activeElement = null;
        });

        // Tap Singolo (Focus Mode) - gestito tramite click per evitare conflitti
        gridContainer.addEventListener('click', (e) => {
            if (interactionMode) return; // Se stavamo trascinando, ignora
            
            const box = e.target.closest('.box');
            if (box && !box.classList.contains('dragging')) {
                // Se non è un drag handle o resize handle
                if (!e.target.classList.contains('drag-handle') && !e.target.classList.contains('resize-handle')) {
                    box.classList.toggle('focus-mode');
                    if (navigator.vibrate) navigator.vibrate(15);
                    if (box.classList.contains('focus-mode')) {
                        showPrice(box.dataset.tf);
                    }
                }
            }
        });

        function showPrice(tfKey) {
            const tf = state.timeframes[tfKey];
            if (!tf) return;
            const pricePill = document.getElementById('price-pill');
            document.getElementById('pill-price').textContent = tf.price;
            document.getElementById('pill-tf').textContent = tfKey;
            
            pricePill.classList.add('show');
            setTimeout(() => { pricePill.classList.remove('show'); }, 3000);
        }

        // --- INIZIO ---
        initGrid();
        updateAll();
        setInterval(updateAll, 15000);
    </script>
</body>
</html>
