<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>MondrianMarket · Saved State</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        :root {
            --mondrian-blue: #0047AB; 
            --mondrian-red: #C1121F;  
            --mondrian-yellow: #F7D117; 
            --mondrian-white: #FFFFFF; 
            --mondrian-black: #000000; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }

        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--mondrian-black);
            overscroll-behavior: none;
        }

        body {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--mondrian-black);
            color: var(--mondrian-white);
            overscroll-behavior: none;
            -webkit-touch-callout: none;
            -webkit-overflow-scrolling: touch;
        }

        /* --- GRIGLIA EDGE-TO-EDGE --- */
        #grid-container {
            display: grid;
            grid-template-columns: 25% 25% 25% 25%;
            grid-template-rows: 50% 50%;
            gap: 4px;
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--mondrian-black);
            padding: 3px;
            overflow: hidden;
            z-index: 1;
        }

        .box {
            position: relative;
            background-color: var(--mondrian-blue); 
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none;
            transition: background-color 0.6s ease, opacity 0.2s ease, transform 0.2s ease;
        }

        .box.up { background-color: var(--mondrian-blue); }
        .box.down { background-color: var(--mondrian-red); }
        
        .box.dragging { opacity: 0.4; transform: scale(0.95); z-index: 50; }
        .box.drag-over { border: 4px solid var(--mondrian-yellow); z-index: 10; }

        .box.focus-mode {
            position: fixed;
            top: 0; left: 0; width: 100vw !important; height: 100dvh !important;
            z-index: 100;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .box.focus-holding {
            transform: scale(0.98);
            filter: brightness(0.8);
        }

        /* --- LAYER DATI --- */
        .outline-square {
            position: absolute;
            border: 2px solid var(--mondrian-white);
            background-color: transparent;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            z-index: 1; 
        }

        .black-rect {
            position: absolute;
            background-color: var(--mondrian-black); 
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            z-index: 0; 
            opacity: 0.9;
        }

        .box.focus-mode .outline-square { border-width: 4px; }

        /* --- LINGUETTA DRAG BOX --- */
        .drag-handle {
            position: absolute;
            top: 0; right: 0;
            width: 50px; height: 50px;
            display: flex; justify-content: flex-end; align-items: flex-start;
            padding: 12px;
            color: var(--mondrian-white);
            font-size: 0.75rem; font-weight: 800;
            letter-spacing: 0.1em;
            z-index: 30; 
            cursor: grab;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
        }
        
        .box.row-top .drag-handle { top: env(safe-area-inset-top); }
        .box.focus-mode .drag-handle { display: none; }

        /* --- MANIGLIA RESIZE BOX --- */
        .box-resize-handle {
            position: absolute;
            bottom: 0; right: 0;
            width: 40px; height: 40px;
            display: flex; justify-content: flex-end; align-items: flex-end;
            padding: 8px;
            z-index: 30; cursor: se-resize;
        }
        .box-resize-handle::before {
            content: ""; width: 12px; height: 12px;
            border-right: 3px solid var(--mondrian-white);
            border-bottom: 3px solid var(--mondrian-white);
        }

        .box.row-bottom .box-resize-handle { bottom: env(safe-area-inset-bottom); }
        .box.focus-mode .box-resize-handle { display: none; }

        /* --- WIDGET GLOBALI FLUTTUANTI --- */
        .global-widget {
            position: absolute;
            background-color: var(--mondrian-yellow);
            border: 3px solid var(--mondrian-black);
            padding: 8px 12px;
            color: var(--mondrian-black);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200; 
            box-shadow: 6px 6px 0px rgba(0,0,0,0.4);
            touch-action: none;
            cursor: grab;
            transition: transform 0.1s ease, filter 0.1s ease;
        }

        .global-widget.dragging {
            cursor: grabbing;
            opacity: 0.9;
            z-index: 210;
        }

        .global-widget.holding {
            transform: scale(0.95);
            filter: brightness(0.8);
        }

        #global-coin-widget {
            top: calc(15% + env(safe-area-inset-top));
            left: 20px;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            width: 100px;
            height: 50px;
        }

        #global-price-widget {
            bottom: calc(15% + env(safe-area-inset-bottom));
            right: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            width: 140px;
            height: 50px;
        }

        .global-resize-handle {
            position: absolute;
            bottom: 0; right: 0;
            width: 20px; height: 20px;
            cursor: se-resize;
            z-index: 220;
        }
        .global-resize-handle::before {
            content: ""; position: absolute;
            bottom: 3px; right: 3px;
            width: 8px; height: 8px;
            border-right: 2px solid var(--mondrian-black);
            border-bottom: 2px solid var(--mondrian-black);
        }

        /* --- TOAST CAMBIO COIN --- */
        #coin-toast {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: var(--mondrian-yellow);
            border: 6px solid var(--mondrian-black);
            padding: 20px 40px;
            font-size: 3rem; font-weight: 800; letter-spacing: 0.1em;
            color: var(--mondrian-black);
            opacity: 0; pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 400;
        }
        #coin-toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    </style>
</head>
<body>

    <div id="grid-container"></div>

    <div class="global-widget" id="global-coin-widget">
        <span id="coin-text">BTC</span>
        <div class="global-resize-handle" data-resize="coin"></div>
    </div>

    <div class="global-widget" id="global-price-widget">
        <span id="price-text">-</span>
        <div class="global-resize-handle" data-resize="price"></div>
    </div>

    <div id="coin-toast">BTC</div>

    <script>
        const COINS = ['BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'XRPUSDT', 'BNBUSDT'];
        let activeCoinIndex = 0;
        let SYMBOL = COINS[activeCoinIndex];
        const BASE_URL = 'https://api.bitget.com';
        const gridContainer = document.getElementById('grid-container');
        const coinToast = document.getElementById('coin-toast');

        let tfDataArray = ['1W', '1D', '12H', '4H', '1H', '30m', '15m', '5m'];
        
        const GRANULARITY = {
            '5m': '5min', '15m': '15min', '30m': '30min', '1H': '1h',
            '4H': '4h', '12H': '12h', '1D': '1day', '1W': '1week'
        };

        const state = { timeframes: {} };
        tfDataArray.forEach(tf => { state.timeframes[tf] = { trend: 'up', count: 0, volumeScore: 0, price: '...' }; });

        let gridCols = [25, 25, 25, 25]; 
        let gridRows = [50, 50]; 

        // --- SALVATAGGIO E CARICAMENTO STATO ---
        const STORAGE_KEY = 'mondrian_state_v1';

        function saveState() {
            const coinW = document.getElementById('global-coin-widget');
            const priceW = document.getElementById('global-price-widget');
            
            const savedData = {
                gridCols,
                gridRows,
                activeCoinIndex,
                coinWidget: {
                    top: coinW.style.top || (15 + 'vh'), // fallback visivo
                    left: coinW.style.left || '20px',
                    width: coinW.style.width || '100px',
                    height: coinW.style.height || '50px'
                },
                priceWidget: {
                    top: priceW.style.top,
                    left: priceW.style.left,
                    width: priceW.style.width || '140px',
                    height: priceW.style.height || '50px'
                }
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(savedData));
        }

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) return false;
            try {
                const data = JSON.parse(saved);
                
                if (data.gridCols && data.gridRows) {
                    gridCols = data.gridCols;
                    gridRows = data.gridRows;
                }

                if (data.activeCoinIndex !== undefined) {
                    activeCoinIndex = data.activeCoinIndex;
                    SYMBOL = COINS[activeCoinIndex];
                    document.getElementById('coin-text').textContent = SYMBOL.replace('USDT', '');
                }

                if (data.coinWidget) {
                    const w = document.getElementById('global-coin-widget');
                    if(data.coinWidget.top) w.style.top = data.coinWidget.top;
                    if(data.coinWidget.left) w.style.left = data.coinWidget.left;
                    if(data.coinWidget.width) w.style.width = data.coinWidget.width;
                    if(data.coinWidget.height) w.style.height = data.coinWidget.height;
                    w.style.bottom = 'auto';
                    w.style.right = 'auto';
                }

                if (data.priceWidget) {
                    const w = document.getElementById('global-price-widget');
                    if(data.priceWidget.top) w.style.top = data.priceWidget.top;
                    if(data.priceWidget.left) w.style.left = data.priceWidget.left;
                    if(data.priceWidget.width) w.style.width = data.priceWidget.width;
                    if(data.priceWidget.height) w.style.height = data.priceWidget.height;
                    w.style.bottom = 'auto';
                    w.style.right = 'auto';
                }

                return true;
            } catch (e) {
                console.error("Errore caricamento stato", e);
                return false;
            }
        }

        function applyGridLayout() {
            gridContainer.style.gridTemplateColumns = `${gridCols[0]}% ${gridCols[1]}% ${gridCols[2]}% ${gridCols[3]}%`;
            gridContainer.style.gridTemplateRows = `${gridRows[0]}% ${gridRows[1]}%`;
        }

        function initGrid() {
            gridContainer.innerHTML = '';
            applyGridLayout();

            tfDataArray.forEach((tfKey, index) => {
                const box = document.createElement('div');
                const isTopRow = index < 4;
                box.className = `box up ${isTopRow ? 'row-top' : 'row-bottom'}`;
                box.dataset.tf = tfKey;
                box.dataset.index = index;
                box.id = `box-${tfKey}`;
                
                const colIndex = index % 4;
                const rowIndex = Math.floor(index / 4);

                box.dataset.col = colIndex;
                box.dataset.row = rowIndex;

                box.innerHTML = `
                    <div class="drag-handle">${tfKey}</div>
                    <div class="box-resize-handle"></div>
                `;
                gridContainer.appendChild(box);
            });
            renderValues();
        }

        function renderValues() {
            tfDataArray.forEach(tfKey => {
                const data = state.timeframes[tfKey];
                const box = document.getElementById(`box-${tfKey}`);
                
                if (!box) return;

                box.classList.toggle('up', data.trend === 'up');
                box.classList.toggle('down', data.trend === 'down');

                box.querySelectorAll('.outline-square').forEach(sq => sq.remove());
                box.querySelectorAll('.black-rect').forEach(rect => rect.remove());

                let countStreak = Math.min(data.count, 8);
                for (let i = 0; i < countStreak; i++) {
                    const square = document.createElement('div');
                    square.className = 'outline-square';
                    square.style.top = `${Math.random() * 70 + 15}%`;
                    square.style.left = `${Math.random() * 70 + 15}%`;
                    square.style.width = `${Math.random() * 10 + 15}%`;
                    square.style.height = `${Math.random() * 10 + 15}%`;
                    square.style.transitionDelay = `${i * 0.05}s`;
                    box.appendChild(square);
                }

                let countBlack = Math.min(data.volumeScore, 5);
                for (let i = 0; i < countBlack; i++) {
                    const rect = document.createElement('div');
                    rect.className = 'black-rect';
                    rect.style.top = `${Math.random() * 80 + 10}%`;
                    rect.style.left = `${Math.random() * 80 + 10}%`;
                    rect.style.width = `${Math.random() * 30 + 10}%`;
                    rect.style.height = `${Math.random() * 15 + 5}%`;
                    rect.style.transitionDelay = `${i * 0.08}s`;
                    box.appendChild(rect);
                }
            });
            
            document.getElementById('price-text').textContent = state.timeframes['4H'].price;
        }

        async function fetchCandles(granularity) {
            const url = `${BASE_URL}/api/v2/spot/market/candles?symbol=${SYMBOL}&granularity=${granularity}&limit=10`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const json = await res.json();
            if (json.code !== '00000') throw new Error(json.msg || 'API error');
            return json.data;
        }

        function calculateData(candles) {
            if (!candles || candles.length === 0) return { trend: 'up', count: 0, volumeScore: 0 };
            let streak = 0, lastDirection = null;
            for (let i = candles.length - 1; i >= 0; i--) {
                const [, open, , , close] = candles[i];
                const openF = parseFloat(open), closeF = parseFloat(close);
                let dir = closeF > openF ? 'up' : (closeF < openF ? 'down' : 'neutral');
                if (dir === 'neutral') continue;
                if (lastDirection === null) { lastDirection = dir; streak = 1; }
                else if (dir === lastDirection) { streak++; }
                else { break; }
            }
            const volumeScore = Math.floor(Math.random() * 4); 
            return { trend: lastDirection || 'up', count: streak, volumeScore };
        }

        async function updateTimeframe(tfKey) {
            try {
                const candles = await fetchCandles(GRANULARITY[tfKey]);
                const { trend, count, volumeScore } = calculateData(candles);
                let price = parseFloat(candles[candles.length - 1][4]);
                let priceStr = price > 1000 ? price.toFixed(2) : price.toFixed(4);
                
                state.timeframes[tfKey].trend = trend;
                state.timeframes[tfKey].count = count;
                state.timeframes[tfKey].volumeScore = volumeScore;
                state.timeframes[tfKey].price = priceStr.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
                
            } catch (err) { console.error(`Errore ${tfKey}:`, err); }
        }

        async function updateAll() {
            await Promise.all(tfDataArray.map(tf => updateTimeframe(tf)));
            renderValues();
        }

        function changeCoin() {
            activeCoinIndex = (activeCoinIndex + 1) % COINS.length;
            SYMBOL = COINS[activeCoinIndex];
            
            document.getElementById('coin-text').textContent = SYMBOL.replace('USDT', '');
            coinToast.textContent = SYMBOL.replace('USDT', '');
            coinToast.classList.add('show');
            
            if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
            updateAll().then(() => {
                setTimeout(() => { coinToast.classList.remove('show'); }, 1200);
            });
            
            saveState(); // Salva la coin appena cambiata
        }

        // --- GESTIONE EVENTI ---
        let pointerState = {
            isDown: false,
            type: null, 
            target: null,
            startX: 0, startY: 0,
            startCols: [], startRows: [],
            startRect: { top: 0, left: 0, width: 0, height: 0 },
            longPressTimer: null,
            longPressFired: false
        };

        function handlePointerDown(e) {
            const box = e.target.closest('.box');
            const globalWidget = e.target.closest('.global-widget');
            const isGlobalResize = e.target.hasAttribute('data-resize');

            pointerState.isDown = true;
            pointerState.startX = e.clientX;
            pointerState.startY = e.clientY;
            pointerState.longPressFired = false;
            pointerState.longPressTimer = null;

            if (globalWidget) {
                pointerState.target = globalWidget;
                const rect = globalWidget.getBoundingClientRect();
                pointerState.startRect = { top: rect.top, left: rect.left, width: rect.width, height: rect.height };

                if (isGlobalResize) {
                    pointerState.type = 'global-resize';
                } else {
                    pointerState.type = 'global-drag';
                    globalWidget.classList.add('dragging');
                    
                    if (globalWidget.id === 'global-coin-widget') {
                        pointerState.longPressTimer = setTimeout(() => {
                            pointerState.longPressFired = true;
                            globalWidget.classList.add('holding');
                            changeCoin();
                            setTimeout(() => { globalWidget.classList.remove('holding'); }, 300);
                        }, 500);
                    }
                }
                e.stopPropagation();
                return;
            }

            if (!box) return;
            pointerState.target = box;

            if (box.classList.contains('focus-mode')) {
                pointerState.type = 'focus-hold';
                pointerState.longPressTimer = setTimeout(() => {
                    pointerState.longPressFired = true;
                    box.classList.add('focus-holding');
                    box.classList.remove('focus-mode');
                    if (navigator.vibrate) navigator.vibrate([20, 50, 20]);
                }, 500);
                return;
            }

            const isDragHandle = e.target.classList.contains('drag-handle');
            const isBoxResizeHandle = e.target.classList.contains('box-resize-handle');

            if (isDragHandle) {
                pointerState.type = 'box-drag';
                box.classList.add('dragging');
                if (navigator.vibrate) navigator.vibrate(20);
            }
            else if (isBoxResizeHandle) {
                pointerState.type = 'box-resize';
                pointerState.startCols = [...gridCols];
                pointerState.startRows = [...gridRows];
            } else {
                pointerState.type = 'longpress-hold';
                pointerState.longPressTimer = setTimeout(() => {
                    pointerState.longPressFired = true;
                    box.classList.add('focus-mode');
                    if (navigator.vibrate) navigator.vibrate([20, 30, 20]);
                }, 500);
            }
        }

        function handlePointerMove(e) {
            if (!pointerState.isDown || !pointerState.target) return;
            
            const dist = Math.abs(e.clientX - pointerState.startX) + Math.abs(e.clientY - pointerState.startY);
            
            if (dist > 10 && pointerState.longPressTimer && !pointerState.longPressFired) {
                clearTimeout(pointerState.longPressTimer);
                pointerState.longPressTimer = null;
                if (pointerState.type === 'focus-hold') pointerState.target.classList.remove('focus-holding');
            }

            e.preventDefault();

            if (pointerState.type === 'global-drag' && dist > 5) {
                const deltaX = e.clientX - pointerState.startX;
                const deltaY = e.clientY - pointerState.startY;
                
                let newTop = pointerState.startRect.top + deltaY;
                let newLeft = pointerState.startRect.left + deltaX;

                newTop = Math.max(0, Math.min(newTop, window.innerHeight - pointerState.startRect.height));
                newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - pointerState.startRect.width));

                pointerState.target.style.top = `${newTop}px`;
                pointerState.target.style.left = `${newLeft}px`;
                pointerState.target.style.bottom = 'auto';
                pointerState.target.style.right = 'auto';
            }
            
            else if (pointerState.type === 'global-resize' && dist > 5) {
                const deltaX = e.clientX - pointerState.startX;
                const deltaY = e.clientY - pointerState.startY;
                
                let newW = pointerState.startRect.width + deltaX;
                let newH = pointerState.startRect.height + deltaY;

                newW = Math.max(60, newW);
                newH = Math.max(40, newH);

                pointerState.target.style.width = `${newW}px`;
                pointerState.target.style.height = `${newH}px`;
            }

            else if (pointerState.type === 'box-drag' && dist > 10) {
                const element = document.elementFromPoint(e.clientX, e.clientY);
                const targetBox = element ? element.closest('.box') : null;
                
                document.querySelectorAll('.box').forEach(b => b.classList.remove('drag-over'));
                if (targetBox && targetBox !== pointerState.target) {
                    targetBox.classList.add('drag-over');
                }
            }

            else if (pointerState.type === 'box-resize' && dist > 5) {
                const deltaX = e.clientX - pointerState.startX;
                const deltaY = e.clientY - pointerState.startY;
                const containerRect = gridContainer.getBoundingClientRect();
                
                const colIdx = parseInt(pointerState.target.dataset.col);
                const rowIdx = parseInt(pointerState.target.dataset.row);

                let deltaPercentX = (deltaX / containerRect.width) * 100;
                let deltaPercentY = (deltaY / containerRect.height) * 100;

                let neighborColIdx = (colIdx === 3) ? 2 : colIdx + 1;
                let newColSize = pointerState.startCols[colIdx] + deltaPercentX;
                let newNeighborSize = pointerState.startCols[neighborColIdx] - deltaPercentX;

                if (newColSize >= 15 && newNeighborSize >= 15) {
                    gridCols[colIdx] = newColSize;
                    gridCols[neighborColIdx] = newNeighborSize;
                }

                let neighborRowIdx = (rowIdx === 1) ? 0 : rowIdx + 1;
                let newRowSize = pointerState.startRows[rowIdx] + deltaPercentY;
                let newNeighborRowSize = pointerState.startRows[neighborRowIdx] - deltaPercentY;

                if (newRowSize >= 15 && newNeighborRowSize >= 15) {
                    gridRows[rowIdx] = newRowSize;
                    gridRows[neighborRowIdx] = newNeighborRowSize;
                }

                applyGridLayout();
            }
        }

        function handlePointerUp(e) {
            if (!pointerState.isDown || !pointerState.target) return;
            
            const dist = Math.abs(e.clientX - pointerState.startX) + Math.abs(e.clientY - pointerState.startY);
            const isTap = dist < 10;
            
            clearTimeout(pointerState.longPressTimer);

            if (pointerState.type === 'global-drag') {
                pointerState.target.classList.remove('dragging');
                pointerState.target.classList.remove('holding');
                saveState(); // Salva la posizione del widget
            }
            
            else if (pointerState.type === 'global-resize') {
                saveState(); // Salva la grandezza del widget
            }

            else if (pointerState.type === 'box-drag') {
                const element = document.elementFromPoint(e.clientX, e.clientY);
                const targetBox = element ? element.closest('.box') : null;

                if (targetBox && targetBox !== pointerState.target) {
                    const indexA = parseInt(pointerState.target.dataset.index);
                    const indexB = parseInt(targetBox.dataset.index);
                    
                    const temp = tfDataArray[indexA];
                    tfDataArray[indexA] = tfDataArray[indexB];
                    tfDataArray[indexB] = temp;

                    initGrid();
                    saveState(); // Salva lo scambio dei box
                    if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
                }
                
                pointerState.target.classList.remove('dragging');
                document.querySelectorAll('.box').forEach(b => b.classList.remove('drag-over'));
            }
            
            else if (pointerState.type === 'box-resize') {
                saveState(); // Salva il ridimensionamento della griglia
            }
            
            else if (pointerState.type === 'focus-hold') {
                pointerState.target.classList.remove('focus-holding');
                if (isTap && !pointerState.longPressFired) {
                    pointerState.target.classList.remove('focus-mode');
                    if (navigator.vibrate) navigator.vibrate(10);
                }
            }

            pointerState.isDown = false;
            pointerState.target = null;
            pointerState.type = null;
            pointerState.longPressFired = false;
        }

        document.addEventListener('pointerdown', handlePointerDown);
        document.addEventListener('pointermove', handlePointerMove);
        document.addEventListener('pointerup', handlePointerUp);
        document.addEventListener('contextmenu', e => e.preventDefault());

        // --- INIZIO ---
        // Tenta di caricare lo stato, se fallisce inizializza da zero
        const hasLoaded = loadState();
        
        if (!hasLoaded) {
            document.getElementById('coin-text').textContent = SYMBOL.replace('USDT', '');
        }
        
        initGrid();
        updateAll();
        setInterval(updateAll, 15000);
    </script>
</body>
</html>
