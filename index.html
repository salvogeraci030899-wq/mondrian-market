<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>MondrianMarket · Fluid Grid</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            width: 100%; 
            height: 100dvh; 
            overflow: hidden;
            overscroll-behavior: none; 
            position: fixed;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000;
            color: #F0F0F0;
        }

        /* --- GRIGLIA FLUIDA --- */
        #grid-container {
            display: grid;
            /* Usiamo le frazioni (fr) per far adattare i box in modo proporzionale */
            grid-template-columns: var(--col1, 1fr) var(--col2, 1fr) var(--col3, 1fr);
            grid-template-rows: var(--row1, 1fr) var(--row2, 1fr);
            width: 100%;
            height: 100%;
            gap: 3px; /* Linee Mondrian */
            background-color: #000; /* Colore delle linee */
            position: relative;
        }

        .box {
            position: relative;
            background-color: #0B1B2B; /* Default Up */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background-color 0.5s ease, transform 0.3s ease, opacity 0.3s ease;
            overflow: hidden;
            z-index: 1;
        }

        .box.up { background-color: #0B1B2B; }
        .box.down { background-color: #2B0B0B; }
        
        /* Modalità Focus a schermo intero */
        .box.focus-mode {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100;
            border: none;
            transform: scale(1);
        }

        /* Animazione Drag & Drop (Swap) */
        .box.dragging {
            opacity: 0.5;
            transform: scale(0.95);
            z-index: 50;
        }
        .box.drag-over {
            border: 3px solid #F7D117;
            z-index: 10;
        }

        /* --- CONTENUTI INTERNI (Safe Area iOS) --- */
        /* Usiamo un wrapper interno per gestire la safe area senza interrompere il colore */
        .box-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            pointer-events: none; /* I click passano al box genitore */
        }

        /* Push del testo in alto per i box della prima riga */
        .box:nth-child(1) .box-content,
        .box:nth-child(2) .box-content,
        .box:nth-child(3) .box-content {
            padding-top: env(safe-area-inset-top);
        }

        /* Push del testo in basso per i box della seconda riga */
        .box:nth-child(4) .box-content,
        .box:nth-child(5) .box-content,
        .box:nth-child(6) .box-content {
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Fix per il focus mode (occupa tutto lo schermo, quindi gestiamo entrambe le safe area) */
        .box.focus-mode .box-content {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .tf-label {
            position: absolute; 
            top: 10px; 
            left: 10px;
            font-size: 0.8rem; font-weight: 600;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.1em;
        }
        
        .tf-count {
            font-size: 3rem; font-weight: 200; line-height: 1;
            text-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .box.focus-mode .tf-count { font-size: 10rem; }

        .tf-dots { display: flex; gap: 6px; margin-top: 10px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background-color: #E0E0E0; }

        /* --- RESIZER DIVIDERS (Linee invisibili per ridimensionare) --- */
        .resizer {
            position: absolute;
            background: transparent;
            z-index: 20;
        }
        /* Verticali (tra colonna 1-2 e 2-3) */
        .resizer-v {
            width: 20px;
            height: 100%;
            cursor: col-resize;
            top: 0;
        }
        .resizer-v:nth-of-type(1) { left: calc(33.33% - 10px); }
        .resizer-v:nth-of-type(2) { left: calc(66.66% - 10px); }

        /* Orizzontale (tra riga 1 e 2) */
        .resizer-h {
            height: 20px;
            width: 100%;
            cursor: row-resize;
            left: 0;
            top: calc(50% - 10px);
        }

        /* --- PILLOLE --- */
        #price-pill, #coin-pill {
            position: absolute; left: 50%;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            display: flex; align-items: center;
            opacity: 0; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 200; pointer-events: none;
        }
        #price-pill { 
            bottom: calc(10% + env(safe-area-inset-bottom)); 
            transform: translate(-50%, 20px); padding: 12px 24px; font-size: 1.2rem; font-weight: 300; gap: 15px;
        }
        #price-pill.show { opacity: 1; transform: translate(-50%, 0); }
        #coin-pill { 
            top: calc(10% + env(safe-area-inset-top)); 
            transform: translate(-50%, -20px); padding: 8px 20px; font-size: 1rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
        }
        #coin-pill.show { opacity: 1; transform: translate(-50%, 0); }

    </style>
</head>
<body>

    <div id="grid-container">
        <!-- I box verranno generati via JS -->
        <!-- I resizer per il ridimensionamento fluido -->
        <div class="resizer resizer-v"></div>
        <div class="resizer resizer-v"></div>
        <div class="resizer resizer-h"></div>
    </div>

    <div id="coin-pill">BTC</div>
    <div id="price-pill">
        <span id="pill-price">-</span>
        <span class="tf-label" id="pill-tf">4H</span>
    </div>

    <script>
        const COINS = ['BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'XRPUSDT', 'BNBUSDT'];
        let activeCoinIndex = 0;
        let SYMBOL = COINS[activeCoinIndex];
        const BASE_URL = 'https://api.bitget.com';
        const gridContainer = document.getElementById('grid-container');

        const TIMEFRAMES = ['1D', '4H', '1H', '12H', '15m', '30m'];
        const GRANULARITY = {
            '15m': '15min', '30m': '30min', '1H': '1h',
            '4H': '4h', '12H': '12h', '1D': '1day'
        };

        const state = { activeTF: '4H', timeframes: {} };
        TIMEFRAMES.forEach(tf => { state.timeframes[tf] = { trend: 'up', count: 0, price: '...' }; });

        // --- RENDER GRIGLIA ---
        function initGrid() {
            // Rimuoviamo i vecchi box ma lasciamo i resizer
            document.querySelectorAll('.box').forEach(b => b.remove());

            TIMEFRAMES.forEach(tfKey => {
                const box = document.createElement('div');
                box.className = `box up`;
                box.dataset.tf = tfKey;
                box.id = `box-${tfKey}`;
                
                box.innerHTML = `
                    <div class="box-content">
                        <div class="tf-label">${tfKey}</div>
                        <div class="tf-count" id="count-${tfKey}">-</div>
                        <div class="tf-dots" id="dots-${tfKey}" style="display:none;"></div>
                    </div>
                `;
                
                // Inserisci prima dei resizer per non coprirli
                gridContainer.insertBefore(box, gridContainer.firstChild);
            });

            setupDraggable();
        }

        function render() {
            TIMEFRAMES.forEach(tfKey => {
                const data = state.timeframes[tfKey];
                const box = document.getElementById(`box-${tfKey}`);
                const countEl = document.getElementById(`count-${tfKey}`);
                const dotsEl = document.getElementById(`dots-${tfKey}`);

                box.classList.toggle('up', data.trend === 'up');
                box.classList.toggle('down', data.trend === 'down');

                if (data.count <= 5) {
                    countEl.style.display = 'block';
                    countEl.textContent = data.count > 0 ? data.count : '-';
                    dotsEl.style.display = 'none';
                } else {
                    countEl.style.display = 'none';
                    dotsEl.style.display = 'flex';
                    dotsEl.innerHTML = '<div class="dot"></div>'.repeat(5);
                }
            });
        }

        // --- API BITGET ---
        async function fetchCandles(granularity) {
            const url = `${BASE_URL}/api/v2/spot/market/candles?symbol=${SYMBOL}&granularity=${granularity}&limit=10`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const json = await res.json();
            if (json.code !== '00000') throw new Error(json.msg || 'API error');
            return json.data;
        }

        function calculateStreak(candles) {
            if (!candles || candles.length === 0) return { trend: 'up', count: 0 };
            let streak = 0, lastDirection = null;
            for (let i = candles.length - 1; i >= 0; i--) {
                const [, open, , , close] = candles[i];
                const openF = parseFloat(open), closeF = parseFloat(close);
                let dir = closeF > openF ? 'up' : (closeF < openF ? 'down' : 'neutral');
                if (dir === 'neutral') continue;
                if (lastDirection === null) { lastDirection = dir; streak = 1; }
                else if (dir === lastDirection) { streak++; }
                else { break; }
            }
            return { trend: lastDirection || 'up', count: streak };
        }

        async function updateTimeframe(tfKey) {
            try {
                const candles = await fetchCandles(GRANULARITY[tfKey]);
                const { trend, count } = calculateStreak(candles);
                let price = parseFloat(candles[candles.length - 1][4]);
                let priceStr = price > 1000 ? price.toFixed(2) : price.toFixed(4);
                state.timeframes[tfKey] = { trend, count, price: priceStr.replace(/\B(?=(\d{3})+(?!\d))/g, ",") };
            } catch (err) { console.error(`Errore ${tfKey}:`, err); }
        }

        async function updateAll() {
            await Promise.all(TIMEFRAMES.map(tf => updateTimeframe(tf)));
            render();
        }

        // --- LOGICA RESIZER (Split Panes) ---
        function setupResizers() {
            const resizersV = document.querySelectorAll('.resizer-v');
            const resizerH = document.querySelector('.resizer-h');
            const grid = document.getElementById('grid-container');

            let startX, startY, startCol1, startCol2, startCol3, startRow1, startRow2;
            let isResizing = false;
            let currentResizer = null;

            function startResize(e, resizer, type, index) {
                isResizing = true;
                currentResizer = { resizer, type, index };
                startX = e.clientX;
                startY = e.clientY;

                const computed = getComputedStyle(grid);
                const cols = computed.gridTemplateColumns.split(' ').map(v => parseFloat(v));
                const rows = computed.gridTemplateRows.split(' ').map(v => parseFloat(v));
                
                startCol1 = cols[0]; startCol2 = cols[1]; startCol3 = cols[2];
                startRow1 = rows[0]; startRow2 = rows[1];

                document.body.style.cursor = type === 'v' ? 'col-resize' : 'row-resize';
                e.target.setPointerCapture(e.pointerId);
            }

            function doResize(e) {
                if (!isResizing) return;

                if (currentResizer.type === 'v') {
                    const deltaX = e.clientX - startX;
                    const totalWidth = startCol1 + startCol2 + startCol3;
                    
                    if (currentResizer.index === 0) {
                        // Primo divisorio
                        let newCol1 = Math.max(30, startCol1 + deltaX);
                        let newCol2 = Math.max(30, startCol2 - deltaX);
                        grid.style.setProperty('--col1', `${(newCol1 / totalWidth) * 100}%`);
                        grid.style.setProperty('--col2', `${(newCol2 / totalWidth) * 100}%`);
                        grid.style.setProperty('--col3', `${(startCol3 / totalWidth) * 100}%`);
                    } else {
                        // Secondo divisorio
                        let newCol2 = Math.max(30, startCol2 + deltaX);
                        let newCol3 = Math.max(30, startCol3 - deltaX);
                        grid.style.setProperty('--col1', `${(startCol1 / totalWidth) * 100}%`);
                        grid.style.setProperty('--col2', `${(newCol2 / totalWidth) * 100}%`);
                        grid.style.setProperty('--col3', `${(newCol3 / totalWidth) * 100}%`);
                    }
                } else {
                    // Orizzontale
                    const deltaY = e.clientY - startY;
                    const totalHeight = startRow1 + startRow2;
                    let newRow1 = Math.max(40, startRow1 + deltaY);
                    let newRow2 = Math.max(40, startRow2 - deltaY);
                    grid.style.setProperty('--row1', `${(newRow1 / totalHeight) * 100}%`);
                    grid.style.setProperty('--row2', `${(newRow2 / totalHeight) * 100}%`);
                }
            }

            function endResize(e) {
                isResizing = false;
                document.body.style.cursor = 'default';
                currentResizer = null;
            }

            resizersV[0].addEventListener('pointerdown', (e) => startResize(e, resizersV[0], 'v', 0));
            resizersV[1].addEventListener('pointerdown', (e) => startResize(e, resizersV[1], 'v', 1));
            resizerH.addEventListener('pointerdown', (e) => startResize(e, resizerH, 'h'));

            document.addEventListener('pointermove', doResize);
            document.addEventListener('pointerup', endResize);
        }

        // --- LOGICA DRAG & DROP (Scambio Box) ---
        function setupDraggable() {
            let draggedBox = null;
            let pressTimer;
            let startX, startY;
            let isDragging = false;
            let isFocusHold = false;

            document.querySelectorAll('.box').forEach(box => {
                box.addEventListener('pointerdown', (e) => {
                    if (box.classList.contains('focus-mode')) {
                        // Logica per uscire dal focus
                        pressTimer = setTimeout(() => {
                            box.classList.remove('focus-mode');
                            if (navigator.vibrate) navigator.vibrate(30);
                        }, 300);
                        startX = e.clientX; startY = e.clientY;
                        return;
                    }

                    startX = e.clientX; startY = e.clientY;
                    isDragging = false;
                    
                    pressTimer = setTimeout(() => {
                        isDragging = true;
                        draggedBox = box;
                        box.classList.add('dragging');
                        if (navigator.vibrate) navigator.vibrate(20);
                    }, 300);
                });
            });

            document.addEventListener('pointermove', (e) => {
                if (isDragging && draggedBox) {
                    e.preventDefault();
                    const element = document.elementFromPoint(e.clientX, e.clientY);
                    const targetBox = element ? element.closest('.box') : null;
                    
                    document.querySelectorAll('.box').forEach(b => b.classList.remove('drag-over'));
                    if (targetBox && targetBox !== draggedBox) {
                        targetBox.classList.add('drag-over');
                    }
                } else {
                    // Annulla timer se muove prima
                    if (Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10) {
                        clearTimeout(pressTimer);
                    }
                }
            });

            document.addEventListener('pointerup', (e) => {
                clearTimeout(pressTimer);
                
                if (isDragging && draggedBox) {
                    const element = document.elementFromPoint(e.clientX, e.clientY);
                    const targetBox = element ? element.closest('.box') : null;

                    if (targetBox && targetBox !== draggedBox) {
                        // SCAMBIO POSIZIONI (Swap Grid Area)
                        const draggedTf = draggedBox.dataset.tf;
                        const targetTf = targetBox.dataset.tf;
                        
                        // Swap dei contenuti HTML e dei dataset
                        const tempHtml = draggedBox.innerHTML;
                        const tempClass = draggedBox.className;
                        const tempId = draggedBox.id;

                        draggedBox.innerHTML = targetBox.innerHTML;
                        draggedBox.className = targetBox.className;
                        draggedBox.id = targetBox.id;
                        draggedBox.dataset.tf = targetBox.dataset.tf;

                        targetBox.innerHTML = tempHtml;
                        targetBox.className = tempClass;
                        targetBox.id = tempId;
                        targetBox.dataset.tf = draggedTf;

                        // Riassegna gli ID interni per far funzionare il render
                        document.getElementById(`count-${targetBox.dataset.tf}`).id = `count-${targetBox.dataset.tf}`; 
                        // (Semplificato: in un'app reale bisognerebbe aggiornare il DOM in modo più pulito, 
                        // ma qui manteniamo la logica semplice scambiando i nodi)
                    }
                    
                    draggedBox.classList.remove('dragging');
                    document.querySelectorAll('.box').forEach(b => b.classList.remove('drag-over'));
                    draggedBox = null;
                    isDragging = false;
                    render(); // Aggiorna i colori
                    
                } else if (!isDragging) {
                    // TAP SINGOLO: Vai in Focus
                    const box = e.target.closest('.box');
                    if (box) {
                        if (box.classList.contains('focus-mode')) {
                            // Se era già in focus, esci (se non è partito il timer)
                            const delta = Math.abs(e.clientX - startX) + Math.abs(e.clientY - startY);
                            if (delta < 10) box.classList.remove('focus-mode');
                        } else {
                            // Attiva Focus
                            box.classList.add('focus-mode');
                            state.activeTF = box.dataset.tf;
                            
                            // Mostra prezzo in focus
                            showPriceAndCoin(state.activeTF);
                        }
                    }
                }
            });
        }

        // --- ALTRE FUNZIONI (Swipe Coin, ecc) ---
        // Swipe up/down per cambiare coin
        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            if (document.querySelector('.focus-mode')) return;
            touchStartY = e.touches[0].clientY;
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            if (document.querySelector('.focus-mode')) return;
            const deltaY = e.changedTouches[0].clientY - touchStartY;
            if (deltaY > 60) changeCoin();
            else if (deltaY < -60) {
                const activeBox = document.querySelector('.box');
                if (activeBox) showPriceAndCoin(activeBox.dataset.tf);
            }
        });

        function changeCoin() {
            if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
            gridContainer.style.opacity = '0.5';
            activeCoinIndex = (activeCoinIndex + 1) % COINS.length;
            SYMBOL = COINS[activeCoinIndex];
            document.getElementById('coin-pill').textContent = SYMBOL.replace('USDT', '');
            document.getElementById('coin-pill').classList.add('show');
            
            updateAll().then(() => {
                gridContainer.style.opacity = '1';
                setTimeout(() => document.getElementById('coin-pill').classList.remove('show'), 2000);
            });
        }

        function showPriceAndCoin(tfKey) {
            if (navigator.vibrate) navigator.vibrate(20);
            const tf = state.timeframes[tfKey];
            if (!tf) return;
            const pricePill = document.getElementById('price-pill');
            document.getElementById('pill-price').textContent = tf.price;
            document.getElementById('pill-tf').textContent = tfKey;
            document.getElementById('coin-pill').textContent = SYMBOL.replace('USDT', '');
            
            pricePill.classList.add('show');
            document.getElementById('coin-pill').classList.add('show');
            
            setTimeout(() => {
                pricePill.classList.remove('show');
                document.getElementById('coin-pill').classList.remove('show');
            }, 3000);
        }

        // --- INIZIO ---
        initGrid();
        setupResizers();
        updateAll();
        setInterval(updateAll, 15000);
    </script>
</body>
</html>
